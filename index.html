<head>

  <meta charset="UTF-8">

  <meta property="og:title" content="Pandlish — Học 20 Ngôn Ngữ Cùng Pandi · Learn 20 Languages">

  <!-- Zero-flash start (Master Spec v2.2 §4): the page is dark from the
       first paint. v2.4 §10: instead of a spinner, a canvas loader shows Pandi's
       head hopping after a squishy ball (with eyes) until Flutter renders
       its first frame. Plain JS / canvas, no assets. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B0F1C; }
    #pandlish-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: radial-gradient(circle at 50% 35%, #19223B 0%, #0B0F1C 68%);
      color: #ffffff; font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity 260ms ease-out;
    }
    #pandlish-loader.done { opacity: 0; pointer-events: none; }
    #pandlish-loader canvas { display: block; width: 320px; height: 170px; max-width: 86vw; }
    #pandlish-loader .title {
      font-weight: 900; font-size: 28px; letter-spacing: -0.4px; color: #FFFFFF;
      text-shadow: 0 6px 24px rgba(108, 134, 255, 0.45);
    }
    #pandlish-loader .sub { font-size: 13px; color: rgba(255, 255, 255, 0.68); }
    #pandlish-loader .dots::after {
      content: ''; display: inline-block; width: 1.2em; text-align: left;
      animation: pandlish-dots 1.2s steps(4, end) infinite;
    }
    @keyframes pandlish-dots {
      0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
    }
  </style>
</head>
<body>
  <div id="pandlish-loader" role="status" aria-live="polite" aria-label="Pandlish">
    <canvas id="pandlish-loader-canvas" width="320" height="170" aria-hidden="true"></canvas>
    <div class="title">Pandlish</div>
    <div class="sub"><span id="pandlish-loader-text">Đang tải</span><span class="dots"></span></div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('pandlish-loader');
      var canvas = document.getElementById('pandlish-loader-canvas');
      var label = document.getElementById('pandlish-loader-text');
      var lang = (navigator.language || 'vi').toLowerCase();
      if (label && lang.indexOf('vi') !== 0) { label.textContent = 'Loading'; }
      var running = true;
      var raf = 0;

      function finish() {
        running = false;
        if (raf) { cancelAnimationFrame(raf); }
        if (!loader) { return; }
        loader.classList.add('done');
        setTimeout(function () { if (loader && loader.parentNode) { loader.parentNode.removeChild(loader); } }, 320);
      }
      window.addEventListener('flutter-first-frame', finish);

      if (!canvas || !canvas.getContext) { return; }
      var ctx = canvas.getContext('2d');
      var W = 320, H = 170, GROUND = 140;
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var speed = reduce ? 0.3 : 1;
      var started = performance.now();
      var OUTLINE = '#000000';

      function ellipse(x, y, rx, ry, fill, stroke, width, rot) {
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.lineWidth = width || 3; ctx.strokeStyle = stroke; ctx.stroke(); }
      }

      function starsAndStreaks(t) {
        // Diagonal speed streaks sweeping past rocket flight path
        ctx.strokeStyle = 'rgba(156,228,255,0.42)';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        var lines = [
          [56, 36, 26, 0.0],
          [260, 44, 22, 0.3],
          [40, 118, 28, 0.55],
          [274, 126, 24, 0.78],
          [110, 152, 22, 0.2]
        ];
        for (var i = 0; i < lines.length; i++) {
          var l = lines[i];
          var p = (t * 1.45 + l[3]) % 1;
          var x = l[0] - p * 34;
          var y = l[1] + p * 15;
          ctx.globalAlpha = Math.sin(p * Math.PI) * 0.65;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - l[2] * 0.91, y + l[2] * 0.41);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        // Twinkling cosmic stars
        var stars = [[42, 66, 3], [268, 72, 3.2], [72, 142, 2.6], [240, 146, 2.8], [164, 20, 2.5]];
        for (var j = 0; j < stars.length; j++) {
          var s = stars[j];
          var pulse = 0.45 + 0.55 * Math.sin(t * 4.2 + j * 1.7);
          ctx.fillStyle = j % 2 === 0
            ? 'rgba(255,232,77,' + (0.75 * pulse).toFixed(2) + ')'
            : 'rgba(180,240,255,' + (0.75 * pulse).toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(s[0], s[1], s[2] * (0.65 + 0.35 * pulse), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function rocketPandi(t) {
        // Steady cruising flight + smooth continuous engine vibration
        var vibX = Math.sin(t * 28) * 1.1 + Math.cos(t * 43) * 0.5;
        var vibY = Math.cos(t * 34) * 1.2 + Math.sin(t * 51) * 0.45;
        var vibRot = Math.sin(t * 31) * 0.015;
        var flicker = 0.92 + 0.11 * Math.sin(t * 29) + 0.06 * Math.cos(t * 47);

        ctx.save();
        ctx.translate(162 + vibX, 94 + vibY);
        ctx.rotate(-0.40 + vibRot);
        ctx.scale(0.84, 0.84);

        // 1. Lush rounded glowing rocket exhaust flame
        var fl = 48 * flicker;
        var sway = Math.sin(t * 36) * 1.5;
        var gradFlame = ctx.createLinearGradient(-52, 0, -52 - fl, 0);
        gradFlame.addColorStop(0, '#FFD84D');
        gradFlame.addColorStop(0.52, '#FF7A21');
        gradFlame.addColorStop(1, '#FF4D1A');
        ctx.fillStyle = gradFlame;
        ctx.beginPath();
        ctx.moveTo(-52, -12);
        ctx.bezierCurveTo(-52 - fl * 0.35, -18.5, -52 - fl * 0.96, -12 + sway * 0.6, -52 - fl, sway);
        ctx.bezierCurveTo(-52 - fl * 0.96, 12 + sway * 0.6, -52 - fl * 0.35, 18.5, -52, 12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#FFFEEB';
        ctx.beginPath();
        ctx.moveTo(-52, -4.6);
        ctx.bezierCurveTo(-52 - fl * 0.22, -6.5, -52 - fl * 0.44, -3.8, -52 - fl * 0.46, sway * 0.2);
        ctx.bezierCurveTo(-52 - fl * 0.44, 3.8, -52 - fl * 0.22, 6.5, -52, 4.6);
        ctx.closePath();
        ctx.fill();

        // 2. Curved metallic silver tail fins
        [-1, 1].forEach(function (s) {
          ctx.beginPath();
          ctx.moveTo(-18, s * 19);
          ctx.bezierCurveTo(-29, s * 30, -45, s * 38, -58, s * 34);
          ctx.bezierCurveTo(-55, s * 25, -50, s * 18, -45, s * 13);
          ctx.closePath();
          ctx.fillStyle = s < 0 ? '#E4ECF8' : '#B3C3DC';
          ctx.fill();
          ctx.lineWidth = 3.2; ctx.strokeStyle = '#1E2433'; ctx.stroke();
        });

        // 3. Brushed titanium thruster nozzle
        ctx.beginPath();
        ctx.moveTo(-45, -12.5); ctx.lineTo(-55, -14.5);
        ctx.quadraticCurveTo(-58, 0, -55, 14.5); ctx.lineTo(-45, 12.5); ctx.closePath();
        ctx.fillStyle = '#8395B0'; ctx.fill();
        ctx.lineWidth = 3.2; ctx.strokeStyle = '#1E2433'; ctx.stroke();

        // 4. Sleek plump pearl-white & metallic silver hull
        ctx.beginPath();
        ctx.moveTo(-47, -13.5);
        ctx.bezierCurveTo(-26, -26.5, 20, -27.5, 52, -14.5);
        ctx.bezierCurveTo(66, -9, 76, -3.2, 78, 0);
        ctx.bezierCurveTo(76, 3.2, 66, 9, 52, 14.5);
        ctx.bezierCurveTo(20, 27.5, -26, 26.5, -47, 13.5);
        ctx.bezierCurveTo(-51, 6, -51, -6, -47, -13.5);
        ctx.closePath();
        var hullGrad = ctx.createLinearGradient(0, -27, 0, 27);
        hullGrad.addColorStop(0, '#FFFFFF');
        hullGrad.addColorStop(0.38, '#F2F6FC');
        hullGrad.addColorStop(0.74, '#D5DFEE');
        hullGrad.addColorStop(1, '#9EB0CA');
        ctx.fillStyle = hullGrad; ctx.fill();
        ctx.save(); ctx.clip();
        // Metallic brushed-silver nose cone
        ctx.beginPath();
        ctx.moveTo(44, -27); ctx.quadraticCurveTo(53, 0, 44, 27);
        ctx.lineTo(82, 27); ctx.lineTo(82, -27); ctx.closePath();
        ctx.fillStyle = '#C2D0E4'; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(44, -26); ctx.quadraticCurveTo(53, 0, 44, 26);
        ctx.lineWidth = 2.6; ctx.strokeStyle = '#1E2433'; ctx.stroke();
        // Glossy specular strip
        ctx.beginPath();
        ctx.moveTo(-30, -14); ctx.bezierCurveTo(0, -21, 32, -19, 64, -6);
        ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
        ctx.restore();
        ctx.lineWidth = 3.4; ctx.strokeStyle = '#1E2433'; ctx.stroke();

        // 5. Glowing sapphire porthole
        ellipse(25, 2, 11, 11, '#D5DFEE', '#1E2433', 2.8);
        ellipse(25, 2, 7.2, 7.2, '#38BDF8', '#1E2433', 2.0);
        ellipse(22.6, -0.6, 2.3, 2.3, '#E0F7FF');

        // 6. Default Pandi (NO headphones + windswept fur!) hugging snugly
        ellipse(-33, -22, 6.5, 6.5, '#FFFFFF', '#1E2433', 3.0);
        ctx.beginPath();
        ctx.moveTo(-29, -17);
        ctx.bezierCurveTo(-27, -36, -8, -42, 9, -34);
        ctx.bezierCurveTo(16, -30, 17, -19, 9, -13);
        ctx.bezierCurveTo(-4, -8, -20, -9, -29, -17);
        ctx.closePath();
        ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 3.2; ctx.strokeStyle = '#1E2433'; ctx.stroke();
        ellipse(-15, -8, 10.5, 7.5, '#3A4254', '#1E2433', 3.0, 0.24);
        ellipse(-16.5, -7, 3.2, 2.2, '#FF9EC2');
        ellipse(5, -13, 7.5, 11.5, '#3A4254', '#1E2433', 3.0, -0.18);

        // Upright Default Pandi head with windswept crown & cheek fur!
        ctx.save();
        ctx.translate(14, -52);
        ctx.rotate(0.28);
        var wf = Math.sin(t * 32) * 1.4;
        ellipse(-27, -23, 11, 11, '#3A4254', '#1E2433', 3.2);
        ellipse(27, -23, 11, 11, '#3A4254', '#1E2433', 3.2);
        ellipse(0, 0, 34, 30, '#FFFFFF', '#1E2433', 3.4);
        // Windswept crown tuft blowing backward
        ctx.beginPath();
        ctx.moveTo(6, -28);
        ctx.quadraticCurveTo(-4, -37, -15 + wf, -31);
        ctx.quadraticCurveTo(-8, -30, -18 - wf * 0.7, -25);
        ctx.quadraticCurveTo(-8, -26, -3, -27);
        ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 2.8; ctx.strokeStyle = '#1E2433'; ctx.stroke();
        // Windswept left cheek fluff
        ctx.beginPath();
        ctx.moveTo(-31, 0);
        ctx.quadraticCurveTo(-41 + wf * 0.6, 2, -40, 8);
        ctx.quadraticCurveTo(-34, 9, -38 - wf * 0.5, 15);
        ctx.quadraticCurveTo(-32, 14, -29, 13);
        ctx.fillStyle = '#FFFFFF'; ctx.fill();
        ctx.lineWidth = 2.6; ctx.strokeStyle = '#1E2433'; ctx.stroke();
        // Eye patches + forward-looking glossy eyes
        ellipse(-10, 2, 9.5, 12.5, '#3A4254', null, 0, 0.45);
        ellipse(18, 1, 9.5, 12.5, '#3A4254', null, 0, -0.45);
        ellipse(-8, 1, 5.5, 5.5, '#111521');
        ellipse(20, 0, 5.5, 5.5, '#111521');
        ellipse(-9.5, -1, 2.0, 2.0, '#FFFFFF');
        ellipse(18.5, -2, 2.0, 2.0, '#FFFFFF');
        ellipse(-20, 12, 6, 3.6, 'rgba(255,140,170,0.45)');
        ellipse(26, 11, 6, 3.6, 'rgba(255,140,170,0.45)');
        ellipse(6, 10, 4.2, 3.0, '#1E2433');
        // Joyful open smile
        ctx.beginPath();
        ctx.moveTo(-1, 13); ctx.quadraticCurveTo(6, 15.5, 13, 13);
        ctx.quadraticCurveTo(12, 22, 6, 22); ctx.quadraticCurveTo(0, 22, -1, 13);
        ctx.closePath();
        ctx.fillStyle = '#E2435B'; ctx.fill();
        ctx.lineWidth = 2.2; ctx.strokeStyle = '#1E2433'; ctx.stroke();
        ctx.restore();

        ctx.restore();
      }

      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        starsAndStreaks(t);
        rocketPandi(t);
      }

      function frame(now) {
        if (!running) { return; }
        draw(((now - started) / 1000) * speed);
        raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
